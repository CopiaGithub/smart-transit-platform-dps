<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Transit Display">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12855c"/>
      <stop offset="1" stop-color="#1aa06b"/>
    </linearGradient>
  </defs>

  <!-- Brand tile, in the same emerald as the argon-primary token, so the tab
       icon and the app read as one product. -->
  <rect width="64" height="64" rx="14" fill="url(#brand)"/>

  <!-- Bus, front three-quarter. Deliberately blunt: at 16px the only things
       that survive are the roof line, the windscreen band and the two wheels,
       so nothing smaller than those is drawn. -->
  <path d="M18 15h28a6 6 0 0 1 6 6v22a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V21a6 6 0 0 1 6-6z" fill="#fff"/>
  <rect x="17" y="21" width="30" height="11" rx="3" fill="#0d6b49"/>
  <circle cx="21" cy="45" r="5" fill="#fff"/>
  <circle cx="43" cy="45" r="5" fill="#fff"/>
  <circle cx="21" cy="45" r="2" fill="#0d6b49"/>
  <circle cx="43" cy="45" r="2" fill="#0d6b49"/>
  <rect x="17" y="36" width="7" height="4" rx="2" fill="#0d6b49"/>
  <rect x="40" y="36" width="7" height="4" rx="2" fill="#0d6b49"/>
</svg>

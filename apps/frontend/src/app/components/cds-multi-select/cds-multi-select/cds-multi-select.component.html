<div class="mb-2">
  <label class="block text-sm font-medium text-gray-700 mb-1">
    {{ label }}
  </label>

  <div
    class="relative border rounded p-2 bg-white cursor-pointer"
    (click)="toggleDropdown()"
  >
    <span>{{ selectedItemNames }}</span>
    <span class="absolute right-2 top-2">&#9662;</span>
  </div>

  <div
    *ngIf="dropdownOpen"
    class="absolute z-10 bg-white border mt-1 w-full max-h-48 overflow-auto"
  >
    <div
      *ngFor="let option of optionsList"
      class="px-4 py-2 hover:bg-gray-100 flex items-center"
    >
      <input
        type="checkbox"
        [checked]="isSelected(option)"
        (click)="$event.stopPropagation()"
        (change)="toggleItem(option)"
      />
      <label class="ml-2">{{ option.name }}</label>
    </div>
  </div>
</div>

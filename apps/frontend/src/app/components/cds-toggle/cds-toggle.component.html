<div class="flex items-center gap-4">
  <cds-label [label]="label" [isAstRequired]="false"></cds-label>

  <button
    type="button"
    class="relative inline-flex items-center h-6 w-11 rounded-full transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-blue-300"
    [class]="checked ? 'bg-blue-600' : 'bg-gray-300'"
    (click)="toggle()"
  >
    <span
      class="inline-block w-4 h-4 bg-white rounded-full transform transition-transform duration-300 shadow"
      [class]="checked ? 'translate-x-6' : 'translate-x-1'"
    ></span>
  </button>
</div>

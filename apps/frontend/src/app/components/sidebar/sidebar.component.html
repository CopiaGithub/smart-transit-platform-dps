<div class="sidebar-container" [class.collapsed]="isCollapsed">
  <aside
    class="sidebar"
    [ngClass]="{
      collapsed: isCollapsed,
      open: isTablet && !isCollapsed,
    }"
  >
    <div class="sidebar-header">
      <div class="avatar-wrapper">
        <div class="sidebar-avatar" title="{{ userName }}">
          <img
            *ngIf="previewUrl"
            [src]="previewUrl"
            alt="{{ userName }}"
            class="w-full h-full object-cover"
          />
          <span *ngIf="!previewUrl">{{ userName[0]?.toUpperCase() }}</span>
        </div>
      </div>
      <div *ngIf="!isCollapsed" class="sidebar-header-text">
        <div class="brand-title truncate" [title]="appTitle">
          {{ appTitle }}
        </div>
        <div class="sidebar-user-name truncate" [title]="userName">
          {{ userName }}
        </div>
      </div>

      <button
        *ngIf="!isCollapsed"
        type="button"
        class="sidebar-profile-btn"
        (click)="redirectToProfile()"
        title="Profile"
        aria-label="Profile"
      >
        <mat-icon>person_outline</mat-icon>
      </button>

      <button
        *ngIf="isTablet && !isCollapsed"
        type="button"
        class="sidebar-close-btn"
        (click)="toggleCollapse()"
        aria-label="Close menu"
      >
        <mat-icon>close</mat-icon>
      </button>

      <!-- Desktop hide/show. On tablet the close button above and the backdrop
           already do this, and the sidebar is off-canvas rather than a rail. -->
      <button
        *ngIf="!isTablet"
        type="button"
        class="collapse-btn"
        (click)="toggleCollapse()"
        [attr.aria-label]="isCollapsed ? 'Show menu' : 'Hide menu'"
        [attr.aria-expanded]="!isCollapsed"
        [title]="isCollapsed ? 'Show menu' : 'Hide menu'"
      >
        <mat-icon>{{ isCollapsed ? "menu" : "menu_open" }}</mat-icon>
      </button>
    </div>

    <nav class="sidebar-menu" role="navigation">
      <ul>
        <li
          *ngFor="let item of menuItems; let i = index"
          class="menu-item"
          [class.active]="isMenuItemActive(item)"
          [class.parent-active]="isImmediateParentOfActiveRoute(item)"
          (click)="
            item.children?.length
              ? toggleLevel(item, menuItems)
              : navigateToRoute(item.route)
          "
          (mouseenter)="showSubmenuOnHover(i)"
          (mouseleave)="hideSubmenuOnLeave()"
        >
          <div class="menu-item-inner">
            <div class="left">
              <div class="icon-circle">
                <mat-icon>{{ item.icon }}</mat-icon>
              </div>
              <span class="label">{{ item.name }}</span>
            </div>

            <div class="right" *ngIf="item.children?.length">
              <mat-icon class="chev" [ngClass]="{ rotated: item.expanded }"
                >chevron_right</mat-icon
              >
            </div>
          </div>

          <ng-container *ngIf="item.children?.length">
            <ul
              class="submenu"
              *ngIf="!isCollapsed && item.expanded"
              [@submenuAnimation]="item.expanded ? 'visible' : 'hidden'"
              (click)="$event.stopPropagation()"
            >
              <li
                *ngFor="let child of item.children"
                class="submenu-item second-level-menu-item"
                [class.active]="isMenuItemActive(child)"
                [class.parent-active]="isImmediateParentOfActiveRoute(child)"
                [class.route-active]="isRouteHighlighted(child)"
                (click)="
                  $event.stopPropagation();
                  child.children?.length
                    ? toggleLevel(child, item.children)
                    : navigateToRoute(child.route)
                "
              >
                <div class="submenu-item-inner">
                  <div class="submenu-label-wrap">
                    <span class="submenu-label second-level-menu-label">{{
                      child.name
                    }}</span>
                  </div>
                  <mat-icon
                    *ngIf="child.children?.length"
                    class="chev"
                    [ngClass]="{ rotated: child.expanded }"
                    >chevron_right</mat-icon
                  >
                </div>
                <ul
                  class="submenu nested"
                  *ngIf="child.children?.length && child.expanded"
                  [@submenuAnimation]="child.expanded ? 'visible' : 'hidden'"
                >
                  <li
                    *ngFor="let gc of child.children"
                    (click)="
                      $event.stopPropagation(); navigateToRoute(gc.route)
                    "
                    class="submenu-item"
                    [class.active]="isMenuItemActive(gc)"
                    [class.route-active]="isRouteHighlighted(gc)"
                  >
                    <div class="submenu-item-inner">
                      <div class="submenu-label-wrap">
                        <mat-icon class="submenu-item-icon">{{
                          gc.icon
                        }}</mat-icon>
                        <span class="submenu-label">{{ gc.name }}</span>
                      </div>
                    </div>
                  </li>
                </ul>
              </li>
            </ul>

            <div class="group" *ngIf="isCollapsed">
              <div
                class="submenu-flyout"
                *ngIf="isSubmenuOpen(i) || item.expanded"
                [@submenuAnimation]="
                  isSubmenuOpen(i) || item.expanded ? 'visible' : 'hidden'
                "
                (click)="$event.stopPropagation()"
              >
                <ul>
                  <li
                    *ngFor="let child of item.children"
                    (click)="
                      $event.stopPropagation();
                      child.children?.length
                        ? toggleLevel(child, item.children)
                        : navigateToRoute(child.route)
                    "
                    class="submenu-item second-level-menu-item"
                  >
                    <div class="submenu-item-inner">
                      <div class="submenu-label-wrap">
                        <span class="submenu-label second-level-menu-label">{{
                          child.name
                        }}</span>
                      </div>
                      <mat-icon
                        *ngIf="child.children?.length"
                        class="chev"
                        [ngClass]="{ rotated: child.expanded }"
                        >chevron_right</mat-icon
                      >
                    </div>
                  </li>
                </ul>
              </div>
            </div>
          </ng-container>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <button
        type="button"
        class="sidebar-logout"
        (click)="logout()"
        [attr.title]="isCollapsed ? 'Log out' : null"
        aria-label="Log out"
      >
        <mat-icon class="sidebar-logout-icon">logout</mat-icon>
        <span *ngIf="!isCollapsed" class="sidebar-logout-label">Log out</span>
      </button>
    </div>
  </aside>
  <div
    class="sidebar-backdrop"
    *ngIf="isTablet && !isCollapsed"
    (click)="toggleCollapse()"
  ></div>
</div>

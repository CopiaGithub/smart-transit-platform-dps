@if (control) {
<div #dropdownRef class="relative w-full" [class]="customclasses">
  <div class="mb-[6px] mt-[2px]" [class]="customlabel">
    <cds-label [isAstRequired]="isRequired" [label]="label" />
  </div>

  <!-- Trigger -->
  <button
    class="w-full px-4 py-2 text-gray-700 rounded-md flex justify-between items-center focus:outline-none border border-gray-300 text-nowrap"
    (click)="toggleDropdown($event)"
    [class]="
      isDataLoading() || control.disabled
        ? 'bg-gray-200 cursor-not-allowed ' + ddstyle
        : 'bg-white ' + ddstyle
    "
    [disabled]="isDataLoading() || control.disabled"
  >
    <!-- Show selected values -->
    @if (selectedOptions.length > 0) {
    <span class="truncate">
      {{ displayText }}
    </span>
    } @else { @if (isDataLoading()) {
    <div class="place-content-center"><cds-spinner /></div>
    } @else {
    <span class="font-normal text-[#ccc] text-nowrap">
      {{ placeholder || "Select values" }}
    </span>
    } }

    <span
      class="transform transition-transform"
      [class.rotate-180]="dropdownOpen"
      >▼</span
    >
  </button>

  <!-- Dropdown -->
  @if (dropdownOpen) {
  <ul
    class="absolute w-full mt-1 bg-white border border-gray-300 rounded-md shadow-md z-10 max-h-40 overflow-y-auto text-nowrap"
  >
    @for (option of optionsList(); track $index) {
    <li
      (click)="toggleSelection(option, $event)"
      class="px-4 py-2 hover:bg-blue-100 cursor-pointer flex items-center gap-2"
    >
      <input
        type="checkbox"
        class="cursor-pointer"
        [checked]="isSelected(option)"
        (click)="$event.stopPropagation()"
      />
      {{ option.name }}
    </li>
    }
  </ul>
  }
</div>

<!-- Validation Errors -->
<cds-validation-errors
  [control]="control"
  [customErrorMessages]="customErrorMessages"
  [errors]="control.errors"
  [isSubmitted]="isSubmitted"
  class="text-red-400"
/>
}

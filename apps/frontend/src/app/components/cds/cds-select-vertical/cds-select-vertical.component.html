<div *ngIf="control" class="w-full cds-select-vertical-root">
  <!-- Flex row: Label and Select -->
  <div
    class="cds-select-vertical-row"
    [ngClass]="customclasses || 'flex items-center gap-3 w-full'"
  >
    <!-- Label -->
    <div class="cds-select-vertical-label" [ngClass]="customlabel">
      <cds-label
        [customLabel]="'block'"
        [isAstRequired]="isAstRequired"
        [label]="label"
      >
      </cds-label>
    </div>

    <!-- Select + Dropdown should be relatively positioned -->
    <div #dropdownRef class="relative flex-1 min-w-0 cds-select-vertical-control">
      <!-- Button -->
      <button
        class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-700 flex justify-between items-center hover:border-indigo-400 hover:shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-200 transition-all duration-200 text-nowrap"
        (click)="toggleDropdown($event)"
        [class.opacity-60]="isDataLoading() || control.disabled"
        [disabled]="isDataLoading() || control.disabled"
        aria-haspopup="listbox"
        [attr.aria-expanded]="dropdownOpen"
      >
        <div class="flex items-center gap-3 truncate">
          <ng-container *ngIf="control.value; else noValue">
            <div class="flex items-center gap-2 truncate">
              <span
                *ngIf="getSelectedIcon()"
                class="material-icons text-indigo-600 text-[18px]"
              >
                {{ getSelectedIcon() }}
              </span>

              <span class="truncate">
                {{ control.value["name"] }}
              </span>
            </div>
          </ng-container>
          <ng-template #noValue>
            <ng-container *ngIf="isDataLoading(); else placeholder">
              <div class="flex items-center"><cds-spinner></cds-spinner></div>
            </ng-container>
            <ng-template #placeholder>
              <span class="font-normal text-gray-400 truncate">{{
                placeholder || "Select a value"
              }}</span>
            </ng-template>
          </ng-template>
        </div>

        <span
          class="ml-2 transform transition-transform"
          [class.rotate-180]="dropdownOpen"
          aria-hidden
        >
          <!-- chevron -->
          <svg
            width="14"
            height="14"
            viewBox="0 0 20 20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M5 7.5L10 12.5L15 7.5"
              stroke="#4B5563"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </button>

      <!-- Dropdown -->
      <ul
        *ngIf="dropdownOpen"
        role="listbox"
        class="absolute left-0 mt-2 w-full bg-white border border-slate-200 rounded-xl shadow-xl z-30 max-h-56 overflow-y-auto"
      >
        <li
          *ngFor="let option of optionsList(); let i = index"
          (click)="selectOption(option)"
          role="option"
          class="px-4 py-2.5 flex items-center gap-3 text-sm text-slate-700 hover:bg-indigo-50 hover:text-indigo-700 cursor-pointer transition-colors"
        >
          <span
            *ngIf="option.icon"
            class="material-icons text-slate-400 text-[18px]"
          >
            {{ option.icon }}
          </span>

          <span class="truncate">
            {{ option.name }}
          </span>
        </li>
      </ul>
    </div>
  </div>

  <!-- Validation -->
  <cds-validation-errors
    [control]="control"
    [customErrorMessages]="customErrorMessages"
    [errors]="control.errors"
    [isSubmitted]="isSubmitted"
    class="text-red-400 mt-1"
  ></cds-validation-errors>
</div>

@if (control) {
  <div #dropdownRef class="relative w-full" [class]="customclasses">
    <div class="mb-[6px] mt-[2px]" [class]="customlabel">
      <cds-label [isAstRequired]="isRequired" [label]="label" />
    </div>

    <button
      class="w-full px-3 py-1.5 text-gray-700 rounded-md flex justify-between items-center gap-2 focus:outline-none border border-gray-300 min-w-0"
      (click)="toggleDropdown($event); $event.preventDefault()"
      [attr.data-testid]="dropdownId + '-button'"
      [class]="
        isDataLoading() || control.disabled
          ? 'bg-gray-200 cursor-not-allowed ' + ddstyle
          : 'bg-white ' + ddstyle
      "
      [disabled]="isDataLoading() || control.disabled"
    >
      @if (control.value) {
        <span class="cds-select-value" [title]="displayLabel(control.value)">
          {{ displayLabel(control.value) }}
        </span>
      }
      @if (!control.value) {
        @if (isDataLoading()) {
          <div class="place-content-center"><cds-spinner /></div>
        } @else {
          <span class="font-normal text-gray-400 text-nowrap">
            {{ placeholder || "Select a value" }}
          </span>
        }
      }

      <mat-icon class="text-gray-500" aria-hidden="true">{{
        dropdownOpen ? "expand_less" : "expand_more"
      }}</mat-icon>
    </button>

    @if (dropdownOpen) {
      <ul
        class="cds-select-panel"
        [class.cds-select-panel--fixed]="panelFixed"
        [style.top.px]="panelFixed ? panelTop : null"
        [style.left.px]="panelFixed ? panelLeft : null"
        [style.width.px]="panelFixed ? panelWidth : null"
      >
        @for (option of optionsList(); track $index) {
          <!-- 🆕 Add testid for each option -->
          <li
            (mousedown)="$event.preventDefault(); selectOption(option)"
            [attr.data-testid]="dropdownId + '-option-' + $index"
            class="cds-select-option px-3 py-1.5 cursor-pointer w-full"
            [class.cds-select-option--selected]="
              control.value?.['value'] === option.value
            "
          >
            {{ displayLabel(option) }}
          </li>
        }
      </ul>
    }
  </div>

  <cds-validation-errors
    [control]="control"
    [customErrorMessages]="customErrorMessages"
    [errors]="control.errors"
    [isSubmitted]="isSubmitted"
    class="text-red-400"
  />
}

@if (!isProcessing()) {
  <button
    [attr.data-testid]="testid"
    [type]="buttonType"
    [ngClass]="{
      'bg-blue-500 hover:bg-blue-600 !text-white border-transparent':
        variant === 'primary' || variant === 'search',
      'bg-gray-500 hover:bg-gray-600 text-gray-100 border-transparent':
        variant === 'secondary',
      'bg-white text-red-600 border border-red-400 hover:bg-red-50':
        variant === 'danger',
      'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50 hover:border-gray-400':
        variant === 'clear',
      'bg-black hover:bg-gray-800 text-gray-300 font-medium border-transparent':
        variant === 'newBtn',
      'bg-green-500 hover:bg-green-600 text-white font-medium border-transparent':
        variant === 'success',
      'opacity-50 cursor-not-allowed': disabled,
    }"
    class="rounded-md px-3 py-1.5 transition duration-200 font-medium focus:outline-none whitespace-nowrap inline-flex items-center justify-center gap-1.5"
    [disabled]="disabled"
  >
    @if (variant === "search") {
      <mat-icon class="cds-btn-icon" aria-hidden="true">search</mat-icon>
    }
    <ng-content></ng-content>
  </button>
} @else {
  <button
    type="button"
    class="inline-flex items-center px-4 py-2 font-semibold leading-6 text-sm shadow rounded-md text-white bg-indigo-500 hover:bg-indigo-400 transition ease-in-out duration-150 cursor-not-allowed whitespace-nowrap"
  >
    <cds-spinner />
    Processing...
  </button>
}

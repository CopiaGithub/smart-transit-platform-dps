<div class="">
  <div class="bg-blue-100 flex justify-between px-1 py-2 w-full rounded-md">
    <div class="flex items-center">
      @if (icon) {
      <mat-icon class="mr-2 text-blue-500">{{ icon }}</mat-icon>
      }
      <h2 class="text-[21px] font-bold text-gray-800 font-heading pl-2">
        {{ title }}
      </h2>
    </div>
    <div>
      @if(toggle){<button
        (click)="toggleCollapse()"
        class="text-gray-600 hover:text-black focus:outline-none text-2xl font-bold mr-3"
      >
        {{ isCollapsed ? "+" : "−" }}</button
      >}
    </div>
  </div>
  <div
    class="overflow-visible transition-all"
    [@expandCollapse]="isCollapsed ? 'collapsed' : 'expanded'"
  >
    <ng-content></ng-content>
  </div>
</div>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Transit Display</title>
    <meta
      name="description"
      content="Transit Display — school bus dispersal and platform management."
    />
    <meta name="theme-color" content="#12855c" />
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <script>
      (function () {
        function setAppHeight() {
          var visual = window.visualViewport && window.visualViewport.height;
          var inner = window.innerHeight;
          var h = Math.round(
            visual && inner ? Math.min(visual, inner) : visual || inner || 0,
          );
          if (h > 0) {
            document.documentElement.style.setProperty('--app-height', h + 'px');
          }
        }
        setAppHeight();
        window.addEventListener('resize', setAppHeight);
        window.addEventListener('orientationchange', setAppHeight);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', setAppHeight);
        }
      })();
    </script>
    <!-- SVG first for browsers that take it (stays crisp at any density); the
         .ico is the fallback and carries 16-256px frames. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
  </head>
  <body class="mat-typography">
    <app-root></app-root>
  </body>
</html>
